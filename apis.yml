description: LNKO is a Moroccan direct-to-consumer eyewear brand and e-commerce retailer selling
  prescription eyeglasses, sunglasses, and children's eyewear (LNKO KIDS) for men and women, plus
  accessories such as tote bags, pouches, hats, and eyeglass chains. It operates physical retail
  locations alongside an online storefront with two-day delivery across Morocco. LNKO is a consumer
  fashion/retail brand backed by 500 Global; it publishes no public developer API, SDK, or API
  documentation, so it carries no API artifacts in the API Evangelist network at this time.
